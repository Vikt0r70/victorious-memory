services:
  api:
    build: ./apps/api
    ports:
      - "127.0.0.1:8080:8080"
    env_file: .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://victorious:${DB_PASSWORD:-victorious}@db:5432/victorious
      - PYTHONUNBUFFERED=1
    dns:
      - 8.8.8.8
      - 8.8.4.4
    volumes:
      # Mount local app code for live reload and quick iteration
      - ./apps/api/app:/app/app
      # Cache HuggingFace models so they survive container rebuilds
      - hf_cache:/root/.cache/huggingface
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 40s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  db:
    image: pgvector/pgvector:pg16
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: victorious
      POSTGRES_USER: victorious
      POSTGRES_PASSWORD: ${DB_PASSWORD:-victorious}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U victorious"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
    ports:
      - "127.0.0.1:3002:3002"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata:
  hf_cache:
