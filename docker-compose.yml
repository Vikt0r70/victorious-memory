services:
  api:
    build: ./apps/api
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://victorious:${DB_PASSWORD:-victorious}@db:5432/victorious
    dns:
      - 8.8.8.8
      - 8.8.4.4
    volumes:
      # Cache HuggingFace models so they survive container rebuilds
      - hf_cache:/root/.cache/huggingface
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: pgvector/pgvector:pg16
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: victorious
      POSTGRES_USER: victorious
      POSTGRES_PASSWORD: ${DB_PASSWORD:-victorious}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U victorious"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
  hf_cache:
